services:
  # 1. Ollama AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: neonclipping-ollama
    ports:
      - "11434:11434"
    volumes:
      # Saves the llama3.2:3b model permanently on your computer
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # 2. Model Puller: Automatically downloads llama3.2:3b on first startup
  ollama-init:
    image: curlimages/curl:latest
    container_name: neonclipping-ollama-init
    depends_on:
      - ollama
    restart: "no"
    entrypoint: >
      sh -c "
      echo 'Waiting for Ollama to be ready...';
      until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo 'Pulling llama3.2:3b AI model (if not already cached)...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\":\"llama3.2:3b\"}' -H 'Content-Type: application/json';
      echo 'AI Model is ready!';
      "

  # 3. NeonClipping Web Application
  neonclipping:
    build: .
    container_name: neonclipping-app
    ports:
      - "8770:8770"
    depends_on:
      - ollama
    volumes:
      # Mounts your data folder so exported clips and MP4s appear on your Mac
      - ./data:/app/data
      # Caches Whisper speech models
      - hf_cache:/root/.cache/huggingface
    environment:
      - NEONCLIPPING_PORT=8770
      - NEONCLIPPING_HOST=0.0.0.0
      - NEONCLIPPING_DOCKER=1
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped

volumes:
  ollama_models:
  hf_cache:
